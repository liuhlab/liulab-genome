# Rules live in styles/Lab/, tracked — so `styles/` is not in .gitignore.
#
# EVERY RULE IS NAMED IN EVERY SECTION. Vale's `*` matches `/`, so sections overlap and
# per-rule settings accumulate, later sections winning. An omitted rule keeps whatever an
# earlier section said, which once left records checked by nothing on green CI. Broad section
# first. Each [tool.liulab.agent-docs] key appears verbatim in one header below; conformance
# rule 3 pairs them by substring, and a key in two headers cannot be paired at all.

StylesPath = styles
MinAlertLevel = error

# 1. Human-facing: the published site. Uncapped.
[{README.md,CHANGELOG.md,docs/**/*.md}]
BasedOnStyles = Lab
Lab.Jargon = YES
Lab.Readability = YES
Lab.LengthDoc = NO
Lab.LengthAdr = NO

# 2. Agent-facing: the router and the agent docs. Word budget only.
[{AGENTS.md,docs/agents/**/*.md}]
BasedOnStyles = Lab
Lab.Jargon = NO
Lab.Readability = NO
Lab.LengthDoc = YES
Lab.LengthAdr = NO

# 3. Decision records: the tighter cap.
[docs/adr/**/*.md]
BasedOnStyles = Lab
Lab.Jargon = NO
Lab.Readability = NO
Lab.LengthDoc = NO
Lab.LengthAdr = YES

# 4. Research notes: uncapped, and exempt from jargon because a note quotes what it argues
# against — a note about banned phrasing lists every banned phrase as evidence.
[docs/research/**/*.md]
BasedOnStyles = Lab
Lab.Jargon = NO
Lab.Readability = NO
Lab.LengthDoc = NO
Lab.LengthAdr = NO

# 5. The context map and the eight glossaries: no file cap, because a glossary is capped per
# ENTRY and not per file — the size of a file here reports how many terms the domain has, which
# is not a writing-quality signal (ADR-0024). Jargon and Readability are off as well: a glossary
# is a list of domain terms, which is what those two rules exist to leave alone.
[{CONTEXT-MAP.md,docs/context/**/*.md}]
BasedOnStyles = Lab
Lab.Jargon = NO
Lab.Readability = NO
Lab.LengthDoc = NO
Lab.LengthAdr = NO
