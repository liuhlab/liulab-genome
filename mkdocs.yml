site_name: liulab-genome
site_description: Handling genomic files — metadata, processing, feature extraction.
site_url: https://liuhlab.github.io/liulab-genome/
repo_url: https://github.com/liuhlab/liulab-genome
repo_name: liuhlab/liulab-genome
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  # Renders each Typer sub-app's own --help into the CLI pages, so a synopsis
  # cannot drift from src/genome/*/cli.py. `pretty` picks the native renderer
  # (options as a table) over shelling out to the `typer` command.
  - mkdocs-typer2:
      pretty: true
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            # A docstring cites a decision by record number, which is right for the reader
            # of the source and wrong for the reader of this page — the record tree is
            # excluded below, so the number names a file they cannot open. This removes the
            # citation from what is rendered here; the docstring in `src/` keeps it.
            extensions:
              - scripts/mkdocs_record_citations.py:StripRecordCitations
            docstring_style: numpy
            # A source listing is published verbatim, so griffe's rewrite cannot reach the
            # citations inside one and thirty-five numbers rode onto this page that way.
            # Stripping them would publish a listing disagreeing with the file it names, so
            # the listings go instead: the source is one click away on GitHub.
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            show_signature_annotations: true
            separate_signature: true
            members_order: source
            merge_init_into_class: true
            heading_level: 2

nav:
  - Get started: index.md
  - Working with a genome:
      - Overview: genome/index.md
      - Assembly: genome/assembly.md
      - Sequences and regions: genome/sequences.md
      - Annotations: genome/annotations.md
      - Aligner indexes: genome/aligner.md
  - Topics:
      - Overview: topics/index.md
      - Transcription factors: topics/transcription-factors.md
      - Motifs: topics/motifs.md
      - Gene identifiers: topics/gene-identifiers.md
      - Homology: topics/homology.md
  - Interfaces:
      - CLI overview: cli/index.md
      - "CLI: genome commands": cli/genome.md
      - "CLI: lookup commands": cli/lookups.md
      - API reference: reference.md

# --strict promotes warnings to errors, and these four default to `info`, which
# --strict ignores. Raising them is what makes a broken anchor, a stray page or a
# link into nowhere fail the build instead of scrolling past in the log.
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

# Agent-facing trees live in the repo and stay OUT of the site; this site is the human
# layer on top of them. A dated measurement is not a docs page, and CI builds --strict,
# so an unexcluded file here would fail the build for not being in the nav.
exclude_docs: |
  adr/
  agents/
  context/
  research/

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

watch:
  - src/genome

# Google Analytics 4 — shared Liu Lab org property. The same tag is used
# across every liuhlab GitHub Pages site so traffic lands in one GA4
# property, separated by page path. gtag.js is GFW-blocked, so
# mainland-China readers are counted host-side (Tencent Cloud) instead.
extra:
  analytics:
    provider: google
    property: G-6M1CJF9WXY
