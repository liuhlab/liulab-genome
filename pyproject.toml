# ============================== project ==============================

[project]
name = "liulab-genome"
description = "Handling reference genome related tasks."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
authors = [{ name = "Liu Lab" }]
keywords = ["bioinformatics", "genomics", "samtools", "bedtools"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Typing :: Typed",
]
dynamic = ["version"]
dependencies = [
    "typer>=0.12",
    "pooch>=1.8",
    "requests>=2.31",
    "tqdm>=4",
    "numpy>=2",
    "pandas>=2.1,<3",
    "py2bit>=0.3",
    "pyarrow>=17",
]

[project.urls]
Homepage = "https://github.com/liuhlab/liulab-genome"
Issues = "https://github.com/liuhlab/liulab-genome/issues"
Changelog = "https://github.com/liuhlab/liulab-genome/blob/main/CHANGELOG.md"

[project.scripts]
genome = "genome.cli:app"

# ============================== build ==============================

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/genome"]

# ============================== pixi ==============================

[tool.pixi.workspace]
channels = ["conda-forge", "bioconda"]
platforms = ["osx-arm64", "linux-64", "osx-64"]

[tool.pixi.pypi-dependencies]
liulab-genome = { path = ".", editable = true }
memelite = ">=0.4,<0.5"   # motif comparison; published to no conda channel

# Every environment gets these; nothing here is optional. Contrast the aligners below.
[tool.pixi.dependencies]
samtools = "*"
bedtools = "*"
ucsc-fatotwobit = "*"
ucsc-twobitinfo = "*"
numpy = ">=2.4.6,<3"
pandas = ">=2.1,<3"
py2bit = ">=1.0.1,<2"
gffutils = ">=0.14,<0.15"
moods = ">=1.9.4,<2"   # the scan engine; docs/research/motif-scan-engine-2026-08-28.md
logomaker = ">=0.8.6,<0.9"
matplotlib-base = ">=3.9,<4"   # what logomaker depends on; the GUI backends go unused
xarray = ">=2025.1"
pyarrow = ">=25.0.0,<26"   # the Parquet sink a scan too large to hold streams to

# One Python, and one of the two places it is declared; the other is `requires-python`.
# Nothing derived from it — ruff's target, pyright's version — is declared. See AGENTS.md.
[tool.pixi.feature.py313.dependencies]
python = "3.13.*"

[tool.pixi.feature.test.dependencies]
pytest = "*"
pytest-cov = "*"
pytest-xdist = "*"
hypothesis = "*"
# The suite tests `scripts/mkdocs_record_citations.py`, which is a griffe extension, so the
# lane that runs the suite needs griffe. It arrives with the docs feature too; naming it
# here is what keeps those tests in the unit lane rather than skipping themselves green in
# it, which is the one thing the two-lane split exists to prevent.
griffe = "*"

[tool.pixi.feature.dev.dependencies]
ruff = "*"
# Exact, where everything else in this table floats. The language server an editor runs is this
# same checker, so a version that drifts between the two is the editor and CI disagreeing about
# one file; and a release of it would turn CI red on a commit that changed nothing. Bumping the
# pin is a commit of its own, with whatever the new release newly reports fixed in it.
pyright = "==1.1.411"
python-build = "*"
hatch-vcs = "*"
ipykernel = "*"   # backs a Jupyter kernel; see the register-kernel task
# Exact: the jargon map and the grade-11 readability number were measured against this version.
vale = "3.19.0.*"
markdownlint-cli2 = "*"
# For conformance, which parses mkdocs.yml with it.
pyyaml = "*"

[tool.pixi.feature.docs.dependencies]
mkdocs-material = "*"
mkdocstrings-python = "*"
ruff = "*"   # mkdocstrings formats rendered signatures with it

[tool.pixi.feature.docs.pypi-dependencies]
# Renders the Typer app's own --help into the CLI pages, so a synopsis cannot go
# stale against src/genome/cli.py. Published to no conda channel; `mkdocs-typer`
# (the unrelated 0.0.3 package) pins typer==0.* from before Typer 0.12 and does
# not work here.
mkdocs-typer2 = ">=0.4,<0.5"

# Optional because they are only needed when Genome.build_<aligner>_index() is called,
# and the aligner checks for itself then. Being optional is what earns them their own lane.
[tool.pixi.feature.star.dependencies]
star = "*"

[tool.pixi.feature.chromap.dependencies]
chromap = "*"

[tool.pixi.environments]
default  = { features = ["py313", "dev", "test", "docs"], solve-group = "default" }
aligners = { features = ["py313", "dev", "test", "docs", "star", "chromap"], solve-group = "default" }
test     = { features = ["py313", "test"], solve-group = "default" }
docs     = { features = ["py313", "docs"], solve-group = "default" }

[tool.pixi.tasks]
lint      = "ruff check ."
fmt       = "ruff format ."
fmt-check = "ruff format --check ."
typecheck = "pyright"

# Two lanes, and together they are the suite — see AGENTS.md for why they must stay one.
# The cap: `auto` alone oversubscribes, a bare number is wrong on a small runner. Ten is the
# floor of the curve on a 14-core box; on a 4-core CI runner `auto` finds four and the cap
# does not bind. `loadgroup` rather than `load` because a handful of tests spawn their own
# process pools: distributed by load, eight of them could fork pools at once and the lane's
# wall went bimodal — 13.5 s or 16.1 s on the same commit, decided by scheduling alone.
# Grouping pins each such module to one worker, which is faster on BOTH box sizes (4 workers:
# 9.4 s against 12.3 s). docs/research/test-suite-cost-and-parallelism-2026-08-30.md
test        = { cmd = "pytest -m 'not aligner' -n auto --maxprocesses 10 --dist=loadgroup", depends-on = ["require-tools"] }
# Serial: eight tests. `depends-on` because pixi runs it first, proving the binaries answer.
test-aligner = { cmd = "pytest -m aligner", depends-on = ["require-aligners"] }
require-aligners = "bash scripts/require_aligners.sh"
require-tools    = "bash scripts/require_tools.sh"
test-cov    = "pytest --cov=genome --cov-report=term-missing"
# Serial: `-x` is unreliable under xdist, and 8 workers to re-run two tests loses.
test-failed = "pytest --lf --new-first -x -q"

# The four steps are not `depends-on`: pixi runs those sequentially, which is the thing
# this replaces. The guard is one — a precondition answers before the gate spends anything.
check = { cmd = "bash scripts/check.sh lint fmt-check typecheck test", depends-on = ["require-tools"] }

# Declared and runnable, deliberately not steps of `check` and not in CI: the tree does not
# pass vale or markdownlint yet, and a gate that is red on arrival teaches nothing. Wiring
# them in is its own commit, after the prose is clean.
#
# `.`, never an absolute path: an absolute path matches no `.vale.ini` section and exits 0.
# The globs stop vale walking trees it never lints — check.sh runs steps concurrently, and a
# walk of .pixi/ races pytest writing __pycache__ there.
vale        = "vale --glob='!{.pixi,site,dist,build}/**' ."
markdownlint = "markdownlint-cli2"
conformance = "python scripts/conformance.py"

build      = "python -m build"
docs       = "mkdocs serve"
# Two commands, not two tasks: a number reaching the site is a docs-build failure, and
# `pixi run docs-build` has to fail locally exactly where CI does.
docs-build = "mkdocs build --strict && bash scripts/check_site_has_no_record_numbers.sh"
# Idempotent. Re-run after recreating the env — the kernelspec path changes.
register-kernel = "python -m ipykernel install --user --name liulab-genome --display-name \"Python (liulab-genome dev)\""

# ============================== ruff ==============================

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]
extend-exclude = [".pixi", "site", "build", "dist"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "PT",   # flake8-pytest-style
    "PTH",  # flake8-use-pathlib
    "N",    # pep8-naming
    "D",    # pydocstyle (numpy convention, configured below)
    "RUF",  # ruff-specific
]
# E501: the formatter owns line length. D203/D213: incompatible with D211/D212.
ignore = ["E501", "D203", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.flake8-bugbear]
# Typer uses call expressions (Option/Argument) as parameter defaults by design.
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"**/__init__.py" = ["D104"]

# ============================== pyright ==============================

[tool.pyright]
# `conftest.py` at the root is three lines of plugin wiring, and it is named explicitly
# because naming a directory does not reach a file beside it.
include = ["src", "tests", "conftest.py"]
# `scripts/` is build tooling, not the wheel, so it is resolved but not checked — the same
# footing `show_numba_cache_key.py` has always had. What makes it resolvable is the
# extension test importing it by name, the way mkdocs loads it. `src` is listed beside it
# because naming any extra path replaces the default root: without it `genome` resolves
# from the installed wheel instead of from source, and every test that reaches for a
# module-private name is reported as importing a private name.
extraPaths = ["src", "scripts"]
exclude = ["**/__pycache__", "**/.pixi"]
venvPath = ".pixi/envs"
venv = "default"
typeCheckingMode = "standard"
# The two rules that hold the full-annotations rule in AGENTS.md, named because `standard`
# leaves both at `none` — it adds five checks over `basic` and a missing annotation is not
# among them, so raising the mode alone would have mechanised nothing. `strict` turns them
# on and 556 other diagnostics with them, which is a different decision than this one.
# Both cost nothing today: every function in `src`, `tests` and `scripts` already annotates.
reportMissingParameterType = "error"
reportUnknownParameterType = "error"
useLibraryCodeForTypes = true
reportMissingTypeStubs = "none"

# ============================== pytest ==============================

[tool.pytest.ini_options]
# `src/genome` is here so the package's docstring examples are collected and run. They are
# the largest body of assertions in the repository — over twelve hundred of them — and
# until they were collected nothing executed a single one, so the "at least one runnable
# example" bar in AGENTS.md was held by review alone and three examples had drifted from
# the code they document. They run in the unit lane, behind the same two autouse guards
# every other test in it runs behind; see the root `conftest.py` for what that took.
testpaths = ["tests", "src/genome"]
# `-p no:anyio`: anyio arrives transitively and registers a `pytest11` entry point every
# xdist worker imports at startup, though no test here is async. Nothing else installed
# is dead weight — pytest-cov, xdist and hypothesis are all load-bearing.
#
# `--doctest-modules` cannot be aimed at one testpath, so it also collects the handful of
# examples in the suite's own shared helpers. They pass, and an example there is worth the
# same as one in `src/` — but `src/` is what it is here for.
addopts = ["-ra", "--strict-markers", "--strict-config", "-p", "no:anyio", "--doctest-modules"]
# Set at config level rather than per example: only a handful of the package's examples
# carry an inline `+ELLIPSIS` today, so this is the shape they are already written in.
doctest_optionflags = ["ELLIPSIS"]
# `scripts/` holds the one build-time module the suite tests: the griffe extension that
# keeps record numbers off the reference page. It is not part of the wheel, so it does not
# belong in `src/`, and it is not a test, so it does not belong in `tests/`.
pythonpath = ["scripts"]
xfail_strict = true
filterwarnings = ["error"]
markers = [
    "aligner: needs STAR or chromap — a binary this package does not ship with itself",
]

# ============================== coverage ==============================

[tool.coverage.run]
branch = true
source = ["src/genome"]

[tool.coverage.report]
show_missing = true
exclude_also = [
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    '\.\.\.',
]

# ============================== liulab ==============================
# Read by `scripts/conformance.py`; its docstring has the rules.

# The declared agent-facing set. Keys are path prefixes matched against `git ls-files`, not
# globs; a trailing `/` matches a directory. Values name the Vale Length rule, or `false`.
# Each key is spelled verbatim inside exactly one `.vale.ini` section header, which is how
# conformance pairs the two.
#
# `CONTEXT-MAP.md` and `docs/context/` take `false` because a glossary here is capped per
# ENTRY, not per file: how long the file runs reports how many terms the domain has, which is
# not a writing-quality signal (ADR-0024). The guard that measures an entry is local.
[tool.liulab.agent-docs]
"AGENTS.md" = "LengthDoc"
"docs/agents/" = "LengthDoc"
"docs/adr/" = "LengthAdr"
"docs/research/" = false
"CONTEXT-MAP.md" = false
"docs/context/" = false

# Keyed by rule name, value the reason. Per-rule, never per-file; no expiry; printed on every
# run, green ones included, which is the visibility this needs on the day the premise stops
# holding. `placeholder-rename` refuses to be waived.
[tool.liulab.waived]
agent-docs-unpublished = "mkdocs.yml's `exclude_docs` block keeps the record, agent, context and research trees out of the built site entirely, so the `search: exclude: true` front matter this rule asks for would be inert on files the site never builds"
