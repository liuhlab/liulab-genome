# ============================== project ==============================

[project]
name = "liulab-genome"
description = "Handling reference genome related tasks."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Liu Lab" }]
keywords = ["bioinformatics", "genomics", "samtools", "bedtools"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Typing :: Typed",
]
dynamic = ["version"]
dependencies = [
    "typer>=0.12",
    "pooch>=1.8",
    "requests>=2.31",
    "tqdm>=4",
    "numpy>=2",
    "pandas>=2.1,<3",
    "py2bit>=0.3",
]

[project.urls]
Homepage = "https://github.com/lhqing/liulab-genome"
Issues = "https://github.com/lhqing/liulab-genome/issues"
Changelog = "https://github.com/lhqing/liulab-genome/blob/main/CHANGELOG.md"

[project.scripts]
genome = "genome.cli:app"

# ============================== build ==============================

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0+dev"

[tool.hatch.build.targets.wheel]
packages = ["src/genome"]

# ============================== pixi ==============================

[tool.pixi.workspace]
channels = ["conda-forge", "bioconda"]
platforms = ["osx-arm64", "linux-64", "osx-64"]

[tool.pixi.pypi-dependencies]
liulab-genome = { path = ".", editable = true }

# The External tools, shelled out to and never reimplemented, plus the Python libraries
# the package imports. In every environment: nothing here is optional.
[tool.pixi.dependencies]
samtools = "*"
bedtools = "*"
ucsc-fatotwobit = "*"
ucsc-twobitinfo = "*"
numpy = ">=2.4.6,<3"
pandas = ">=2.1,<3"
py2bit = ">=1.0.1,<2"
gffutils = ">=0.14,<0.15"

# One Python, on purpose: the suite runs on 3.13, and the 3.12 floor is held by
# `ruff target-version` and `pyright pythonVersion`, not by a test lane.
[tool.pixi.feature.py313.dependencies]
python = "3.13.*"

[tool.pixi.feature.test.dependencies]
pytest = "*"
pytest-cov = "*"
pytest-xdist = "*"
hypothesis = "*"

[tool.pixi.feature.dev.dependencies]
ruff = "*"
pyright = "*"
pre-commit = "*"
python-build = "*"
hatch-vcs = "*"
ipykernel = "*"   # backs a Jupyter kernel; see the register-kernel task

[tool.pixi.feature.docs.dependencies]
mkdocs-material = "*"
mkdocstrings-python = "*"
ruff = "*"   # mkdocstrings formats rendered signatures with it

# THE ALIGNERS ARE THE ONLY BINARIES THIS PACKAGE DOES NOT SHIP WITH ITSELF, and they
# are here rather than in `[tool.pixi.dependencies]` because installing them is only
# required when Genome.build_<aligner>_index() is called — the aligner checks for
# itself at that point. That is also why the tests needing them are a separate lane:
# an environment without them makes those tests skip, and a skip is green.
[tool.pixi.feature.star.dependencies]
star = "*"

[tool.pixi.feature.chromap.dependencies]
chromap = "*"

[tool.pixi.environments]
default  = { features = ["py313", "dev", "test", "docs"], solve-group = "default" }
aligners = { features = ["py313", "dev", "test", "docs", "star", "chromap"], solve-group = "default" }
test     = { features = ["py313", "test"], solve-group = "default" }
docs     = { features = ["py313", "docs"], solve-group = "default" }

[tool.pixi.tasks]
lint      = "ruff check ."
fmt       = "ruff format ."
fmt-check = "ruff format --check ."
typecheck = "pyright"

# TWO LANES, AND TOGETHER THEY ARE THE SUITE. `-m aligner` against its negation is total
# by boolean negation, so no test can fall between them however the marker is applied,
# and `--strict-markers` refuses one that was invented. `_needs` in tests/test_aligner.py
# applies the marker and the skip under one name, so a test cannot carry the skip alone
# and sit in the wrong lane. CI gives each lane a job; `check` runs the first of them.
#
# `auto` capped at 8: bare `auto` oversubscribes a big box (3.4 s against 2.8 s here) and
# a bare 8 oversubscribes a 2-core runner, so `auto` finds the cores and the cap keeps
# the count where it was measured best. Serial: 5.9 s. See docs/research/.
test        = "pytest -m 'not aligner' -n auto --maxprocesses 8 --dist=load"
# Serial, and not capped: three tests, where a worker pool costs more than it saves.
# `depends-on` precisely BECAUSE pixi runs it sequentially — the binaries are proved to
# answer before the selection happens. See scripts/require_aligners.sh.
test-aligner = { cmd = "pytest -m aligner", depends-on = ["require-aligners"] }
require-aligners = "bash scripts/require_aligners.sh"
# Everything, aligner tests included — they skip themselves when the binaries are absent.
test-cov    = "pytest --cov=genome --cov-report=term-missing"
# Serial on purpose: `-x` is unreliable under xdist, and 8 workers to re-run two tests loses.
test-failed = "pytest --lf --new-first -x -q"

# Not `depends-on`: pixi runs those sequentially, which is what this replaces. check.sh
# runs the four concurrently and prints each one's output whole, in a fixed order.
check     = "bash scripts/check.sh lint fmt-check typecheck test"

build      = "python -m build"
docs       = "mkdocs serve"
docs-build = "mkdocs build --strict"
# Idempotent. Re-run after recreating the env — the kernelspec path changes.
register-kernel = "python -m ipykernel install --user --name liulab-genome --display-name \"Python (liulab-genome dev)\""

# ============================== ruff ==============================

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py312"
extend-exclude = [".pixi", "site", "build", "dist"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "PT",   # flake8-pytest-style
    "PTH",  # flake8-use-pathlib
    "N",    # pep8-naming
    "D",    # pydocstyle (numpy convention, configured below)
    "RUF",  # ruff-specific
]
# E501: the formatter owns line length. D203/D213: incompatible with D211/D212.
ignore = ["E501", "D203", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.flake8-bugbear]
# Typer uses call expressions (Option/Argument) as parameter defaults by design.
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "S101"]
"**/__init__.py" = ["D104"]

# ============================== pyright ==============================

[tool.pyright]
include = ["src", "tests"]
exclude = ["**/__pycache__", "**/.pixi"]
venvPath = ".pixi/envs"
venv = "default"
pythonVersion = "3.12"
typeCheckingMode = "basic"
useLibraryCodeForTypes = true
reportMissingTypeStubs = "none"

# ============================== pytest ==============================

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
xfail_strict = true
filterwarnings = ["error"]
# Semantic, not a speed label: what a test needs, never how long it takes.
markers = [
    "aligner: needs STAR or chromap — a binary this package does not ship with itself",
]

# ============================== coverage ==============================

[tool.coverage.run]
branch = true
source = ["src/genome"]

[tool.coverage.report]
show_missing = true
exclude_also = [
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    '\.\.\.',
]
