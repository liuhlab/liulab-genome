# ============================== project ==============================

[project]
name = "liulab-genome"
description = "Handling reference genome related tasks."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Liu Lab" }]
keywords = ["bioinformatics", "genomics", "samtools", "bedtools"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Typing :: Typed",
]
dynamic = ["version"]
dependencies = [
    "typer>=0.12",
    "pooch>=1.8",
    "requests>=2.31",
    "tqdm>=4",
    "numpy>=2",
    "pandas>=2.1,<3",
    "py2bit>=0.3",
]

[project.urls]
Homepage = "https://github.com/lhqing/liulab-genome"
Issues = "https://github.com/lhqing/liulab-genome/issues"
Changelog = "https://github.com/lhqing/liulab-genome/blob/main/CHANGELOG.md"

[project.scripts]
genome = "genome.cli:app"

# ============================== build ==============================

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0+dev"

[tool.hatch.build.targets.wheel]
packages = ["src/genome"]

# ============================== pixi ==============================

[tool.pixi.workspace]
channels = ["conda-forge", "bioconda"]
platforms = ["osx-arm64", "linux-64", "osx-64"]

[tool.pixi.pypi-dependencies]
liulab-genome = { path = ".", editable = true }

# Every environment gets these; nothing here is optional. Contrast the aligners below.
[tool.pixi.dependencies]
samtools = "*"
bedtools = "*"
ucsc-fatotwobit = "*"
ucsc-twobitinfo = "*"
numpy = ">=2.4.6,<3"
pandas = ">=2.1,<3"
py2bit = ">=1.0.1,<2"
gffutils = ">=0.14,<0.15"

# One Python on purpose; the 3.12 floor is ruff's and pyright's. See AGENTS.md.
[tool.pixi.feature.py313.dependencies]
python = "3.13.*"

[tool.pixi.feature.test.dependencies]
pytest = "*"
pytest-cov = "*"
pytest-xdist = "*"
hypothesis = "*"

[tool.pixi.feature.dev.dependencies]
ruff = "*"
pyright = "*"
pre-commit = "*"
python-build = "*"
hatch-vcs = "*"
ipykernel = "*"   # backs a Jupyter kernel; see the register-kernel task

[tool.pixi.feature.docs.dependencies]
mkdocs-material = "*"
mkdocstrings-python = "*"
ruff = "*"   # mkdocstrings formats rendered signatures with it

# Optional because they are only needed when Genome.build_<aligner>_index() is called,
# and the aligner checks for itself then. Being optional is what earns them their own lane.
[tool.pixi.feature.star.dependencies]
star = "*"

[tool.pixi.feature.chromap.dependencies]
chromap = "*"

[tool.pixi.environments]
default  = { features = ["py313", "dev", "test", "docs"], solve-group = "default" }
aligners = { features = ["py313", "dev", "test", "docs", "star", "chromap"], solve-group = "default" }
test     = { features = ["py313", "test"], solve-group = "default" }
docs     = { features = ["py313", "docs"], solve-group = "default" }

[tool.pixi.tasks]
lint      = "ruff check ."
fmt       = "ruff format ."
fmt-check = "ruff format --check ."
typecheck = "pyright"

# Two lanes, and together they are the suite — see AGENTS.md for why they must stay one.
# The cap: `auto` alone oversubscribes, a bare 8 oversubscribes a small runner.
# docs/research/test-suite-parallelism-2026-08-14.md
test        = { cmd = "pytest -m 'not aligner' -n auto --maxprocesses 8 --dist=load", depends-on = ["require-tools"] }
# Serial: three tests. `depends-on` because pixi runs it first, proving the binaries answer.
test-aligner = { cmd = "pytest -m aligner", depends-on = ["require-aligners"] }
require-aligners = "bash scripts/require_aligners.sh"
require-tools    = "bash scripts/require_tools.sh"
test-cov    = "pytest --cov=genome --cov-report=term-missing"
# Serial: `-x` is unreliable under xdist, and 8 workers to re-run two tests loses.
test-failed = "pytest --lf --new-first -x -q"

# The four steps are not `depends-on`: pixi runs those sequentially, which is the thing
# this replaces. The guard is one — a precondition answers before the gate spends anything.
check = { cmd = "bash scripts/check.sh lint fmt-check typecheck test", depends-on = ["require-tools"] }

build      = "python -m build"
docs       = "mkdocs serve"
docs-build = "mkdocs build --strict"
# Idempotent. Re-run after recreating the env — the kernelspec path changes.
register-kernel = "python -m ipykernel install --user --name liulab-genome --display-name \"Python (liulab-genome dev)\""

# ============================== ruff ==============================

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py312"
extend-exclude = [".pixi", "site", "build", "dist"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "PT",   # flake8-pytest-style
    "PTH",  # flake8-use-pathlib
    "N",    # pep8-naming
    "D",    # pydocstyle (numpy convention, configured below)
    "RUF",  # ruff-specific
]
# E501: the formatter owns line length. D203/D213: incompatible with D211/D212.
ignore = ["E501", "D203", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.flake8-bugbear]
# Typer uses call expressions (Option/Argument) as parameter defaults by design.
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "S101"]
"**/__init__.py" = ["D104"]

# ============================== pyright ==============================

[tool.pyright]
include = ["src", "tests"]
exclude = ["**/__pycache__", "**/.pixi"]
venvPath = ".pixi/envs"
venv = "default"
pythonVersion = "3.12"
typeCheckingMode = "basic"
useLibraryCodeForTypes = true
reportMissingTypeStubs = "none"

# ============================== pytest ==============================

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
xfail_strict = true
filterwarnings = ["error"]
markers = [
    "aligner: needs STAR or chromap — a binary this package does not ship with itself",
]

# ============================== coverage ==============================

[tool.coverage.run]
branch = true
source = ["src/genome"]

[tool.coverage.report]
show_missing = true
exclude_also = [
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    '\.\.\.',
]
