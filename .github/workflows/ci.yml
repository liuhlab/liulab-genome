name: CI

# Five jobs, run concurrently by GitHub. Wall-clock is set by the slowest, so the shape
# that matters is not "how many jobs" but "does any job do work another already did".
# The two test lanes are a PARTITION — `-m aligner` against its negation, total by
# boolean negation — so between them they run the suite exactly once.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    name: lint + typecheck + docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          environments: default
          locked: true
      - name: ruff (lint)
        run: pixi run -e default lint
      - name: ruff format check
        run: pixi run -e default fmt-check
      - name: pyright
        run: pixi run -e default typecheck
      # Does the SITE build: a dead internal link, a nav entry naming a file that moved,
      # a docstring mkdocstrings can no longer import. Folded in here rather than given
      # a fifth runner — `default` already carries the `docs` feature, so this reuses
      # the setup-pixi above and its whole marginal cost is the ~4 s build. Build only;
      # deploying stays in docs.yml, the one workflow granted `contents: write`.
      - name: mkdocs build --strict
        run: pixi run -e default docs-build

  # The unit lane: everything that does not need an aligner. It cannot select until
  # samtools, faToTwoBit and twoBitInfo answer (the verb depends on
  # scripts/require_tools.sh, which CI inherits rather than spelling a second copy of
  # which binaries the lane needs) — with those three absent, 90 of its 925 tests skip
  # themselves and the lane reports green having written no FASTA at all.
  # `--durations=10` because what sets a parallel lane's wall is one indivisible test,
  # and no worker count goes below one test — printing it makes that floor visible in
  # every log. A measurement, not a gate.
  test:
    name: test
    runs-on: ubuntu-latest
    # memelite's scan and compare engines are `@numba.njit(cache=True)`, and numba writes
    # that cache beside the package it compiled — inside the pixi env. setup-pixi saves its
    # env tarball straight after `pixi install`, which is BEFORE any test has run, so the
    # compiled artifacts were never in it: every run recompiled from source. Measured at
    # 27.5 s, which was 47% of this lane's whole wall and the single largest item in CI.
    #
    # Redirecting the cache to a path of our own is what makes it cacheable separately.
    # It is 936 KB and restores in under a second.
    env:
      NUMBA_CACHE_DIR: ${{ github.workspace }}/.numba-cache
    steps:
      - uses: actions/checkout@v5
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          environments: test
          locked: true
      # Keyed on the lockfile, because a compiled artifact is only valid for the numba and
      # memelite that produced it, and the lock pins both — but with the run id APPENDED and
      # the lock-only prefix as a restore key, so the cache is rewritten every run.
      #
      # That rotation is the whole point, and a fixed key is a trap here. numba caches per
      # type signature, so one run compiles only the specialisations it happened to reach;
      # `actions/cache` refuses to overwrite an existing key, so a first run that saved a
      # PARTIAL cache freezes it permanently and every later run pays the missing compiles
      # forever. Measured: two runs on the same commit, one restoring a 437 KB cache and
      # paying nothing, the other restoring a 474 KB cache and still recompiling four tests
      # at 24-39 s each. Rotating the key lets each run save what it learned, so the cache
      # converges on the full set of signatures the suite needs instead of freezing at
      # whichever subset went first.
      - name: numba JIT cache
        uses: actions/cache@v4
        with:
          path: .numba-cache
          key: numba-${{ runner.os }}-${{ hashFiles('pixi.lock') }}-${{ github.run_id }}
          restore-keys: |
            numba-${{ runner.os }}-${{ hashFiles('pixi.lock') }}-
      - name: pytest -m 'not aligner'
        run: pixi run -e test test -- --durations=10

  # The aligner lane: the eight tests that build a real index. It used to re-run the
  # WHOLE suite here just to un-skip them, which meant the unit lane's coverage was a
  # function of what happened to be installed — those eight skipped there, silently,
  # and a skip is green. The marker partition ends both halves of that: this lane
  # selects only what it installed binaries for, and cannot select at all until they
  # answer (the verb depends on scripts/require_aligners.sh, which CI inherits rather
  # than spelling a second copy of which binaries the lane needs).
  aligner:
    name: test (STAR + chromap)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          environments: aligners
          locked: true
      - name: pytest -m aligner
        run: pixi run -e aligners test-aligner -- --durations=10

  build:
    name: build wheel + sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # hatch-vcs needs full history to derive a version
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          environments: default
          locked: true
      - name: pixi run build
        run: pixi run -e default build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
