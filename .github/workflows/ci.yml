name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    name: lint + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.14
        with:
          environments: default
          locked: true
      - name: ruff (lint)
        run: pixi run -e default lint
      - name: ruff format check
        run: pixi run -e default fmt-check
      - name: pyright
        run: pixi run -e default typecheck

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.14
        with:
          environments: test
          locked: true
      - name: pytest
        run: pixi run -e test test

  # The `test` lane above runs in an environment without STAR or chromap, where the
  # aligner integration tests skip themselves. This lane installs them and runs the
  # suite for real, so the index builds are exercised on every push rather than only
  # on a developer machine that happens to have both tools. The task asserts each
  # binary before pytest, so the lane cannot go green while silently still skipping.
  aligners:
    name: aligner integration (STAR + chromap)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.14
        with:
          environments: aligners
          locked: true
      - name: pytest with STAR + chromap installed
        run: pixi run -e aligners test-aligners

  build:
    name: build wheel + sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # hatch-vcs needs full history to derive a version
      - uses: prefix-dev/setup-pixi@v0.8.14
        with:
          environments: default
          locked: true
      - name: pixi run build
        run: pixi run -e default build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  docs:
    name: docs build (no deploy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: prefix-dev/setup-pixi@v0.8.14
        with:
          environments: docs
          locked: true
      - name: mkdocs build --strict
        run: pixi run -e docs mkdocs build --strict
