# The gate, run on the pull request rather than on the branch.
#
# ONE job, because GitHub bills every job rounded up to a whole minute: several short jobs bill
# far more than one longer one, and on a private repo the minutes are shared by every repo the
# account owns. Every step after the first gate step runs even when one before it failed, so
# a run still reports every failure.
#
# Every step invokes `pixi run <task>` and never a command line. The step list lives in
# `pyproject.toml` — `check-static` names it once — so adding a step is one more word
# there and nothing here. Conformance rule `workflow-step-tasks` holds every workflow in
# the repo to it, and what it checks is that the command came from the task table: a step
# may pass arguments after `--`, and the rule prints them rather than forbidding them.
# It reads the `run:` line only, so `env:`, `working-directory:`, `shell:` and a local
# composite action can still make a step do something no `pixi run` does here. Keeping
# CI and a laptop the same is a habit this file keeps, not a property anything proves.
#
# The two test lanes split the suite on `-m aligner`, so between them they run every test not
# marked `slow` exactly once.
name: CI

on:
  # `pull_request` tests the MERGE commit — the code that will exist after the merge, not the
  # branch tip — and it is the only event that produces a run for a pull request from a fork.
  # Nothing runs on a push to `main`: it would test again what the pull request just tested.
  # `workflow_dispatch` is for checking `main` by hand.
  #
  # `ready_for_review` is listed because a draft runs nothing (the job's `if:` below): open a
  # pull request as a draft, pass the local gate, then mark it ready to run CI once.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

# Keyed on the workflow and the ref, so pushing again to a pull request cancels the run it
# supersedes. A run started by hand is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    # Skipped on a draft, which bills nothing. A run by hand has no pull request, so it runs.
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    # memelite's scan and compare engines are `@numba.njit(cache=True)`, and numba writes
    # that cache beside the package it compiled — inside the pixi env. setup-pixi saves its
    # env tarball straight after `pixi install`, which is BEFORE any test has run, so the
    # compiled artifacts were never in it: every run recompiled from source. Redirecting the
    # cache to a path of our own is what makes it cacheable separately.
    #
    # `NUMBA_CPU_NAME` is what makes the restored cache USABLE. numba keys each compiled
    # overload on a tuple whose middle element is `(target_triple, cpu_name, cpu_features)`,
    # so the host CPU MODEL is part of the key. GitHub's runners are heterogeneous, so an
    # unpinned key varies per run: the cache restores, numba rejects it per overload, and the
    # suite recompiles. That failure is silent and reads as a hit — `actions/cache` reports
    # on the FILES, numba decides on the CONTENTS, and only `--durations` tells you which
    # happened. What `generic` costs is in
    # docs/research/test-suite-cost-and-parallelism-2026-08-30.md, which is also where to add
    # anything learned later rather than growing this comment.
    #
    # Set HERE and not in the pixi task on purpose: a developer's cache is warm from ordinary
    # use and their CPU never changes, so there is nothing to fix locally.
    #
    # `NUMBA_CPU_FEATURES` is redundant TODAY — numba defaults it to `""` whenever
    # `NUMBA_CPU_NAME` is `generic`. It is set anyway because that default is numba's private
    # business, and if it ever changes the key silently starts varying by the host feature
    # string, which is the exact bug this pin ends.
    env:
      NUMBA_CACHE_DIR: ${{ github.workspace }}/.numba-cache
      NUMBA_CPU_NAME: generic
      NUMBA_CPU_FEATURES: ''
    steps:
      # A real checkout, not a source archive: `conformance` shells out to `git ls-files`
      # and exits 2 without a `.git` — its "could not run", spelled apart from the 1 a
      # broken rule exits, so a bad checkout never reads as a rule this repo failed.
      - uses: actions/checkout@v7
        with:
          # Full history, because `build` needs the tags: the version is dynamic and
          # hatch-vcs reads the newest tag, so a shallow clone would stamp a released commit
          # as a dev build.
          fetch-depth: 0
      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          # `default` carries the `docs` feature, so it builds the site too. `aligners` adds
          # STAR and chromap for the aligner lane; both share one solve group.
          environments: default aligners
          # Fail if `pixi.lock` no longer matches `pyproject.toml`, rather than silently
          # solving something else. This is what makes CI run the versions the laptop ran.
          locked: true
      # Keyed on the lockfile, because a compiled artifact is only valid for the numba and
      # memelite that produced it, and the lock pins both — but with the run id APPENDED and
      # the lock-only prefix as a restore key, so the cache is rewritten every run.
      #
      # That rotation is the whole point, and a fixed key is a trap here. numba caches per
      # type signature, so one run compiles only the specialisations it happened to reach;
      # `actions/cache` refuses to overwrite an existing key, so a first run that saved a
      # PARTIAL cache would freeze it, and every later run would pay the missing compiles.
      # Rotating the key lets each run save what it learned, so the cache converges on the
      # full set of signatures the suite needs.
      #
      # `run_attempt` as well as `run_id`, because a run id is SHARED by every attempt of a
      # run: with the id alone a re-run restores its own first attempt's cache and then
      # cannot save, so a re-run could never converge.
      - name: numba JIT cache
        uses: actions/cache@v4
        with:
          path: .numba-cache
          key: numba-${{ runner.os }}-${{ hashFiles('pixi.lock') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            numba-${{ runner.os }}-${{ hashFiles('pixi.lock') }}-
      # `check-static` and `test` as two steps, not `check` as one, so each has its own
      # verdict on the run page. The site build is one of the static steps.
      - run: pixi run check-static
      # What the restored cache is keyed against, printed before anything reads it. See the
      # script for which loss looks like which cause.
      - run: pixi run numba-cache-key
        if: ${{ !cancelled() }}
      - run: pixi run test
        if: ${{ !cancelled() }}
      # The eight tests that build a real index, in the environment that installs the
      # aligners. The task cannot select until they answer (scripts/require_aligners.sh).
      - run: pixi run -e aligners test-aligner
        if: ${{ !cancelled() }}
      - run: pixi run build
        id: build
        if: ${{ !cancelled() }}
      - uses: actions/upload-artifact@v7
        # Only a wheel that was built: a failed build would otherwise fail this step too.
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        with:
          name: dist
          path: dist/
          # An empty upload is a green step that proved nothing.
          if-no-files-found: error
